[project]
name = "jenesboot-v2"
version = "0.1.0"
description = "A submarine game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
jenesboot-v2 = "jenesboot_v2:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
