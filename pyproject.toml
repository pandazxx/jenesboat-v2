[project]
name = "jenesboat-v2"
version = "0.1.0"
description = "A submarine game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["raylib>=5.5"]

[project.scripts]
jenesboat-v2 = "jenesboat_v2:entrypoint"

[dependency-groups]
dev = ["pytest", "ruff", "pygbag>=0.9.3", "playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
